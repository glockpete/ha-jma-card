name: Release

# Checks every published release: the version the card reports must equal the tag. No asset is attached on purpose.
# HACS 2.0.5 takes a dashboard card from the release assets whenever a release has any, and since 2026-10-23 GitHub
# answers a release-asset download with a header over 8190 bytes that Home Assistant's HTTP client rejects
# (hacs/integration#5643). Without an asset HACS reads ha-jma-card.js from the tag's source (raw.githubusercontent.com).
# If the check fails the release goes back to draft, so HACS never offers a version whose card reports another one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to check, for example v0.13.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check the release
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      # The version the card reports in the browser console and in the card picker must equal the tag (a leading v is
      # not part of the version)
      - name: The card version must equal the tag
        run: |
          version="$(tr -d '\r' < ha-jma-card.js | sed -nE 's/^const CARD_VERSION = "([^"]+)";.*$/\1/p' | head -n 1)"
          if [ -z "$version" ]; then
            echo "ha-jma-card.js has no line: const CARD_VERSION = \"x.y.z\";" >&2
            exit 1
          fi
          if [ "$version" != "${TAG#v}" ]; then
            echo "ha-jma-card.js says $version but the tag is $TAG" >&2
            exit 1
          fi
      - name: Put the release back to draft so HACS doesn't offer it
        if: failure() && github.event_name == 'release'
        run: gh release edit "$TAG" --draft=true
